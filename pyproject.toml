[project]
name = "explainer-video-pipeline"
version = "0.1.0"
description = "General-purpose pipeline that turns written academic content into narrated explainer videos"
requires-python = ">=3.12,<3.13"

# Pinned to <3.13 because kokoro (TTS) declares Requires-Python >=3.10,<3.13.
# uv provisions the interpreter itself, so this is a declaration rather than a
# setup problem -- see docs/design/tech-stack.md#packaging--uv.

dependencies = [
    # web
    "litestar[standard]>=2.13",
    "pydantic>=2.13",
    "pydantic-settings>=2.7",
    # llm + orchestration
    "openai>=2.0",
    "instructor>=1.7",
    "langgraph>=1.2",
    "langchain-core>=1.0",
    # ingestion
    "pypdf>=6.0",
    "python-docx>=1.2",
    # media
    "soundfile>=0.14",
    "numpy>=2.0",
    "mcp>=1.2",
    "edge-tts>=7.2.8",
    "pillow>=12.3.0",
    "python-pptx>=1.0.2",
]

[project.optional-dependencies]
# Heavy ML deps, installed separately so the web app can run without them.
audio = [
    "kokoro>=0.9.4",
    "faster-whisper>=1.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "httpx>=0.28",
    "ruff>=0.9",
    "playwright>=1.62.0",
]

[project.scripts]
pipeline = "pipeline.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pipeline"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
